name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 엔진 문법
        run: node --check engine/v1/board.js
      - name: 예시 및 스킬 아키텍처 데이터 점검
        run: |
          node skills/archi-board/scripts/check.mjs examples/memo/board-data.js
          node skills/archi-board/scripts/check.mjs docs/board/board-data.js
      - name: 쇼케이스 한 파일(index.html)이 원본과 같은지
        run: node tools/build-showcase.mjs --check
      - name: 묶기 스크립트
        run: node skills/archi-board/scripts/inline.mjs examples/memo /tmp/memo.single.html
      - name: 꺼내기 → 다시 묶기가 같은 파일인지
        run: |
          node skills/archi-board/scripts/unpack.mjs /tmp/memo.single.html /tmp/rt
          node skills/archi-board/scripts/check.mjs /tmp/rt/board-data.js
          node skills/archi-board/scripts/inline.mjs /tmp/rt /tmp/rt.single.html
          cmp /tmp/memo.single.html /tmp/rt.single.html
      - name: 내보내기 → 가져오기 왕복(ArchiMate · Mermaid)
        run: node tools/test-export.mjs
      - name: ab (Rust) 시험 · 두 보드 읽기 · 근거 파일 확인
        run: |
          cargo test --manifest-path rust/Cargo.toml
          cargo build --release --manifest-path rust/Cargo.toml
          rust/target/release/ab check examples/memo/board-data.js
          rust/target/release/ab check docs/board/board-data.js
          rust/target/release/ab drift docs/board/board-data.js
